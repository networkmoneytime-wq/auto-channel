<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OAuth callback</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, monospace; max-width: 700px; margin: 60px auto; padding: 0 20px; line-height: 1.6; color: #222; word-break: break-all; }
  textarea { width: 100%; height: 120px; font-family: monospace; }
</style>
</head>
<body>
  <h1>OAuth callback</h1>
  <p>This page reads the access token from the URL fragment (never sent to any
  server) so you can copy it. Close this tab when you're done.</p>
  <textarea id="out" readonly></textarea>
  <script>
    document.getElementById('out').value = window.location.hash || window.location.search || '(no token found in URL)';
  </script>
</body>
</html>
