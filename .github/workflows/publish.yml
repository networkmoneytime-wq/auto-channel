name: publish

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # Without this, print() output is buffered and only flushed at
          # process exit — if the job gets cancelled or hangs mid-run (e.g.
          # a runaway ffmpeg encode), every diagnostic line is lost and the
          # log shows nothing useful. Confirmed the hard way: a stuck anime
          # run's cancelled log had zero [ideate]/[voiceover]/[assemble]
          # lines, only the raw ffmpeg output that was writing directly.
          PYTHONUNBUFFERED: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python -m src.orchestrator

      - name: Persist state
        run: |
          git config user.name "auto-channel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || git commit -m "chore: update state [skip ci]"
          # publish-new-channels runs on the same cron and pushes state to main
          # too, so a bare push loses the race whenever main moved mid-run and
          # silently drops this run's state: it failed this job on 09-23, 09-24,
          # 09-25 and 09-26, and each lost run's topic was then picked again,
          # posting a near-duplicate video. Rebase and retry instead.
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase && git push && exit 0
            echo "state push attempt $attempt failed; retrying"
            sleep $((attempt * 3 + RANDOM % 5))
          done
          exit 1
