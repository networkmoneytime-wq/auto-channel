name: dry-run-channel

# Manual-only end-to-end check of one channel: runs the real pipeline
# (script, voiceover, visuals, ffmpeg assembly) with every uploader
# disabled, then attaches the finished video as a downloadable artifact.
# Nothing is posted and state changes stay on the runner (never committed),
# so it's safe to run before a channel's platform accounts/secrets exist, or
# to verify a pipeline change without spending a real post.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to run"
        type: choice
        options: [meme, cars, gaming, technology, anime, dailyap]
        default: meme
      topic:
        description: "Force this exact topic line (optional, e.g. AI_CHARACTER; blank = the channel's next topic)"
        type: string
        required: false
        default: ""

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline without uploading
        env:
          PYTHONUNBUFFERED: "1"
          CHANNEL: ${{ inputs.channel }}
          TOPIC: ${{ inputs.topic }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from src import orchestrator

          orchestrator.UPLOADERS.clear()
          forced = os.environ.get("TOPIC", "").strip()
          if forced:
              orchestrator.pick_topic = lambda state: forced
          orchestrator.run()
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ inputs.channel }}
          path: output/last_run.mp4
          retention-days: 3
