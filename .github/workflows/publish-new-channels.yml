name: publish-new-channels

on:
  schedule:
    # Posting-time experiment, started 2026-09-26: the old 08:00 and 16:00 UTC
    # slots (4am and noon US Eastern) were the weakest, so all three runs now
    # sit in the US evening. 00:00 UTC is unchanged and acts as the control.
    # Review around 2026-10-10. Keep in sync with publish.yml.
    - cron: "0 22 * * *"
    - cron: "0 0 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # sequential: avoids concurrent pushes racing on state/
      matrix:
        channel: [cars, gaming, technology, anime]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # Without this, print() output is buffered and only flushed at
          # process exit — if the job gets cancelled or hangs mid-run (e.g.
          # a runaway ffmpeg encode), every diagnostic line is lost and the
          # log shows nothing useful. Confirmed the hard way: a stuck anime
          # run's cancelled log had zero [ideate]/[voiceover]/[assemble]
          # lines, only the raw ffmpeg output that was writing directly.
          PYTHONUNBUFFERED: "1"
          CHANNEL: ${{ matrix.channel }}
          # Shared across every channel: one LLM/stock-footage key, and one
          # TikTok developer app whose OAuth grants (refresh tokens, below)
          # vary per channel/account.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID_CARS: ${{ secrets.YOUTUBE_CLIENT_ID_CARS }}
          YOUTUBE_CLIENT_SECRET_CARS: ${{ secrets.YOUTUBE_CLIENT_SECRET_CARS }}
          YOUTUBE_REFRESH_TOKEN_CARS: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CARS }}
          TIKTOK_REFRESH_TOKEN_CARS: ${{ secrets.TIKTOK_REFRESH_TOKEN_CARS }}
          IG_ACCESS_TOKEN_CARS: ${{ secrets.IG_ACCESS_TOKEN_CARS }}
          IG_USER_ID_CARS: ${{ secrets.IG_USER_ID_CARS }}
          FB_PAGE_ID_CARS: ${{ secrets.FB_PAGE_ID_CARS }}
          YOUTUBE_CLIENT_ID_GAMING: ${{ secrets.YOUTUBE_CLIENT_ID_GAMING }}
          YOUTUBE_CLIENT_SECRET_GAMING: ${{ secrets.YOUTUBE_CLIENT_SECRET_GAMING }}
          YOUTUBE_REFRESH_TOKEN_GAMING: ${{ secrets.YOUTUBE_REFRESH_TOKEN_GAMING }}
          TIKTOK_REFRESH_TOKEN_GAMING: ${{ secrets.TIKTOK_REFRESH_TOKEN_GAMING }}
          IG_ACCESS_TOKEN_GAMING: ${{ secrets.IG_ACCESS_TOKEN_GAMING }}
          IG_USER_ID_GAMING: ${{ secrets.IG_USER_ID_GAMING }}
          FB_PAGE_ID_GAMING: ${{ secrets.FB_PAGE_ID_GAMING }}
          YOUTUBE_CLIENT_ID_TECHNOLOGY: ${{ secrets.YOUTUBE_CLIENT_ID_TECHNOLOGY }}
          YOUTUBE_CLIENT_SECRET_TECHNOLOGY: ${{ secrets.YOUTUBE_CLIENT_SECRET_TECHNOLOGY }}
          YOUTUBE_REFRESH_TOKEN_TECHNOLOGY: ${{ secrets.YOUTUBE_REFRESH_TOKEN_TECHNOLOGY }}
          TIKTOK_REFRESH_TOKEN_TECHNOLOGY: ${{ secrets.TIKTOK_REFRESH_TOKEN_TECHNOLOGY }}
          IG_ACCESS_TOKEN_TECHNOLOGY: ${{ secrets.IG_ACCESS_TOKEN_TECHNOLOGY }}
          IG_USER_ID_TECHNOLOGY: ${{ secrets.IG_USER_ID_TECHNOLOGY }}
          FB_PAGE_ID_TECHNOLOGY: ${{ secrets.FB_PAGE_ID_TECHNOLOGY }}
          YOUTUBE_CLIENT_ID_ANIME: ${{ secrets.YOUTUBE_CLIENT_ID_ANIME }}
          YOUTUBE_CLIENT_SECRET_ANIME: ${{ secrets.YOUTUBE_CLIENT_SECRET_ANIME }}
          YOUTUBE_REFRESH_TOKEN_ANIME: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ANIME }}
          TIKTOK_REFRESH_TOKEN_ANIME: ${{ secrets.TIKTOK_REFRESH_TOKEN_ANIME }}
          IG_ACCESS_TOKEN_ANIME: ${{ secrets.IG_ACCESS_TOKEN_ANIME }}
          IG_USER_ID_ANIME: ${{ secrets.IG_USER_ID_ANIME }}
          FB_PAGE_ID_ANIME: ${{ secrets.FB_PAGE_ID_ANIME }}
        run: python -m src.orchestrator

      - name: Persist state
        run: |
          git config user.name "auto-channel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "chore: update ${{ matrix.channel }} state [skip ci]"
          # The dailyap workflow pushes state to main on this same cron, so a
          # single pull-then-push can lose the race and drop this run's state.
          # Rebase and retry instead.
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase && git push && exit 0
            echo "state push attempt $attempt failed; retrying"
            sleep $((attempt * 3 + RANDOM % 5))
          done
          exit 1
